GuideOneTitle = Main information
GuideOneMessageOne = [cyan]Foundation PvP [white] is an OpenPvP server.
GuideOneMessageTwo = You can create a new team by clicking on the ground. Build Vaults to obtain additional cores.
GuideTwoTitle = Commands.
GuideTwoMessageOne = The main command for managing your team is /team. You can also use commands such as /join, /accept and /deny.
GuideTwoMessageTwo = Use /spectate to leave your team and become a spectator.
GuideTwoMessageThree = Use /destroy to destroy the building you are standing on, including cores.
GuideTwoMessageFour = Use /restart to start or participate in a restart vote.
GuideThreeTitle = Rating system
GuideThreeMessageOne = You can earn points by eliminating other teams.
GuideThreeMessageTwo = Your rating is determined by the number of points you have earned.
GuideThreeMessageThree = Use /top to see the top 10 players. Use /rank to see your position and points.
